name: Generate Pac-Man Contribution Graph

on:
  # Run automatically every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Allows manually running the workflow at any time from the Actions tab
  workflow_dispatch:

  # Run on every push to main or the preview branch
  push:
    branches:
      - main
      - feature/profile-upgrades
    paths-ignore:
      - "profile-3d-contrib/**"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man contribution SVGs
        uses: abozanona/pacman-contribution-graph@v5.3.2
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"
          player_style: "opportunistic"

      - name: Push Pac-Man SVGs to the output-pacman branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output-pacman
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
