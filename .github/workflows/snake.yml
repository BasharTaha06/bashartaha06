name: Generate Snake

on:
  # Run automatically every day at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # Allows manually running the workflow at any time from the Actions tab
  workflow_dispatch:

  # Run on every push to the main branch
  push:
    branches:
      - main
    paths-ignore:
      - "profile-3d-contrib/**"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Tighten top and bottom SVG spacing
        run: |
          python3 - <<'EOF'
          import glob, pathlib, re
          for path in glob.glob("dist/*.svg"):
              p = pathlib.Path(path)
              text = p.read_text(encoding="utf-8")
              text = re.sub(
                  r'<svg viewBox="(-?\d+) -32 (\d+) 192" width="\2" height="192"',
                  r'<svg viewBox="\1 -18 \2 164" width="\2" height="164"',
                  text,
                  count=1,
              )
              text = text.replace(' y="144"', ' y="132"')
              p.write_text(text, encoding="utf-8")
          EOF

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
